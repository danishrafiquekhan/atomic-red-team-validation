name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate evidence JSON is well-formed
        run: |
          python3 -c "
          import json, glob
          files = glob.glob('case-studies/**/evidence/*.json', recursive=True)
          assert files, 'no evidence JSON files found'
          for f in files:
              json.load(open(f))
              print(f, 'OK')
          "

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
